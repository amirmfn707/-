<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base for iOS and PWA -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- Central Calendar Card Background -->
  <rect x="110" y="120" width="292" height="270" rx="36" fill="rgba(255, 255, 255, 0.12)" filter="url(#dropShadow)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" />

  <!-- Calendar Top Bar Accent -->
  <path d="M 110 156 Q 110 120 146 120 L 366 120 Q 402 120 402 156 L 402 180 L 110 180 Z" fill="rgba(255, 255, 255, 0.22)" />

  <!-- Calendar Binding Rings -->
  <circle cx="180" cy="120" r="10" fill="#FFFFFF" />
  <circle cx="332" cy="120" r="10" fill="#FFFFFF" />
  <rect x="176" y="100" width="8" height="24" rx="4" fill="#E0E7FF" />
  <rect x="328" y="100" width="8" height="24" rx="4" fill="#E0E7FF" />

  <!-- Sound Waves / Voice Rays -->
  <circle cx="256" cy="285" r="76" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.6" />
  <circle cx="256" cy="285" r="104" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" opacity="0.35" stroke-dasharray="6 8" />

  <!-- Central Microphone Symbol -->
  <g filter="url(#dropShadow)">
    <!-- Mic Body -->
    <rect x="232" y="220" width="48" height="88" rx="24" fill="#FFFFFF" />
    <!-- Mic Stand Arc -->
    <path d="M 214 266 C 214 316, 298 316, 298 266" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <!-- Mic Stem -->
    <line x1="256" y1="316" x2="256" y2="346" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <!-- Mic Base -->
    <line x1="228" y1="346" x2="284" y2="346" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Sparkle / AI Star -->
  <path d="M 370 190 Q 370 206 386 206 Q 370 206 370 222 Q 370 206 354 206 Q 370 206 370 190 Z" fill="#FDE047" />
  <path d="M 142 220 Q 142 230 152 230 Q 142 230 142 240 Q 142 230 132 230 Q 142 230 142 220 Z" fill="#38BDF8" />
</svg>
